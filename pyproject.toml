[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora"
version = "2.1.0"
description = "Nexora — Metasploit-style, key-free OSINT framework: domain, IP, email, URL, ASN, phone, and social media investigation from the command line."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Cazo-Net" }]
keywords = ["osint", "security", "recon", "subdomain", "threat-intel", "osint-tool", "social-media"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28",
    "dnspython>=2.3",
    "aiohttp>=3.8",
    "cryptography>=41",
]

[project.optional-dependencies]
pdf = ["pypdf>=4"]
phone = ["phonenumbers>=8.13"]
full = ["pypdf>=4", "phonenumbers>=8.13"]

[project.scripts]
nexora = "nexora.cli:main"
osint = "nexora.cli:main"    # legacy alias

[project.urls]
Homepage = "https://github.com/Cazo-Net/Nexora"
Repository = "https://github.com/Cazo-Net/Nexora"
Issues = "https://github.com/Cazo-Net/Nexora/issues"

[tool.setuptools]
packages = ["nexora"]
py-modules = ["osint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that need real network access (deselected by default)",
]
filterwarnings = ["ignore::DeprecationWarning"]
